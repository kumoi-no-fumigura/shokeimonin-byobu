name: 訳の誤り
description: 現代語訳の誤りや、よりよい訳を知らせる
title: "[訳] 昭慶門院御屏風押色紙和歌 "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "yaku/ の行頭にある ID（例: gunsho07-shokeimonin-byobu-0001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの訳
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した訳
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
